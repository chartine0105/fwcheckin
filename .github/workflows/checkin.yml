name: Daily check-in

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fwcheckin-daily
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4 # 顺便帮你把版本号改成了更稳定的 v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run check-in
        env:
          fwxs: ${{ secrets.fwxs }} 
          # 下面这一行是新加的，用来传递微信推送 Token
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }} 
        run: node fwxs_checkin.js
