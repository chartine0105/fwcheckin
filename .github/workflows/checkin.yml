name: Daily check-in

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run check-in
        env:
          fwxs: ${{ secrets.fwxs }}
        run: |
          node fwxs_checkin.js
          # 捕获 node 脚本的退出代码
          if [ $? -ne 0 ]; then
            echo "::error::脚本报错，强制结束！"
            exit 1
          fi
