
name: Daily check-in

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run check-in
        env:
          fwxs: ${{ secrets.fwxs }}
        run: node fwxs_checkin.js
